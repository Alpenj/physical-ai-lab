    <path d="M700 410 C815 405 900 400 1080 400" stroke="url(#cyan)" stroke-width="12" filter="url(#glow)"/>
    <path d="M700 410 C790 350 835 280 900 250" stroke="#334e68" stroke-width="8" opacity=".7"/>
