<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">미래 예측과 지연, 토크 한계를 연결한 도식</title>
  <desc id="desc">여러 미래 경로가 시간 지연을 지나 힘의 한계 안에서 하나의 실행 경로로 좁혀지는 추상 도식</desc>
